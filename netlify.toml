[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Long-term caching for fingerprinted build assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Friendly short URLs → canonical pages (301).
[[redirects]]
  from = "/quote"
  to = "/get-a-quote/"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/get-a-quote/"
  status = 301
[[redirects]]
  from = "/estimate"
  to = "/get-a-quote/"
  status = 301
[[redirects]]
  from = "/garage-sale"
  to = "/garage-sale-junk-pickup/"
  status = 301
[[redirects]]
  from = "/yard-sign"
  to = "/garage-sale-junk-pickup/?utm_source=yard_sign&utm_medium=offline&utm_campaign=garage_sale_signs"
  status = 302
[[redirects]]
  from = "/sign"
  to = "/garage-sale-junk-pickup/?utm_source=yard_sign&utm_medium=offline&utm_campaign=garage_sale_signs"
  status = 302
[[redirects]]
  from = "/springfield"
  to = "/junk-removal-springfield-mo/"
  status = 301
