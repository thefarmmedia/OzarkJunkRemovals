[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# netlify/functions/submission-created.mjs forwards verified form submissions
# to the CRM webhook set in the GHL_WEBHOOK_URL environment variable.
[functions]
  directory = "netlify/functions"

# Long-term caching for fingerprinted build assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Old Netlify subdomain → custom domain (deploy previews use other subdomains and are unaffected).
[[redirects]]
  from = "https://ozarkjunkremovals.netlify.app/*"
  to = "https://ozarkjunkremovals.com/:splat"
  status = 301
  force = true

# Friendly short URLs → canonical pages (301).
[[redirects]]
  from = "/quote"
  to = "/get-a-quote/"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/get-a-quote/"
  status = 301
[[redirects]]
